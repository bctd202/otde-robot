services:
  backend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    ports: ["8000:8000"]
    environment:
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-mock}
      DATABASE_URL: sqlite:////data/liquidity_hunter.db
      MOCK_SCENARIO: active
      ENABLE_DEMO_OPTION_CONTRACTS: "false"
      PAPER_ONLY: "true"
      AUTOMATED_OPTION_SHADOW_ENABLED: "true"
      TASTYTRADE_CLIENT_ID: ${TASTYTRADE_CLIENT_ID:-}
      TASTYTRADE_CLIENT_SECRET: ${TASTYTRADE_CLIENT_SECRET:-}
      TASTYTRADE_REFRESH_TOKEN: ${TASTYTRADE_REFRESH_TOKEN:-}
      TASTYTRADE_BASE_URL: ${TASTYTRADE_BASE_URL:-https://api.tastyworks.com}
      TASTYTRADE_USER_AGENT: ${TASTYTRADE_USER_AGENT:-parlay-research/1.0}
      LOTTERY_PAPER_STARTING_CASH: ${LOTTERY_PAPER_STARTING_CASH:-500}
      LOTTERY_PAPER_DAILY_DEBIT_CAP: ${LOTTERY_PAPER_DAILY_DEBIT_CAP:-100}
    volumes: ["app-data:/data"]
  frontend:
    restart: unless-stopped
    build: ./frontend
    ports: ["5173:5173"]
    environment:
      VITE_API_URL: http://localhost:8000/api
    depends_on: [backend]
volumes:
  app-data:
