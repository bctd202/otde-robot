services:
  backend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    ports: ["8000:8000"]
    environment:
      MARKET_DATA_PROVIDER: mock
      DATABASE_URL: sqlite:////data/liquidity_hunter.db
      MOCK_SCENARIO: active
      ENABLE_DEMO_OPTION_CONTRACTS: "false"
      PAPER_ONLY: "true"
      AUTOMATED_OPTION_SHADOW_ENABLED: "true"
    volumes: ["app-data:/data"]
  frontend:
    restart: unless-stopped
    build: ./frontend
    ports: ["5173:5173"]
    environment:
      VITE_API_URL: http://localhost:8000/api
    depends_on: [backend]
volumes:
  app-data:
